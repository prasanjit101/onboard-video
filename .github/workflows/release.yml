name: Release

on:
  push:
    branches:
      - main

# Prevent two release runs from racing — second push waits for the first to finish.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # commit the "Version Packages" PR and push tags
      pull-requests: write  # open / update the Version Packages PR
      id-token: write       # npm provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Changesets needs the full history to compute version bumps and write the changelog.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for `npm publish` + .npmrc auth)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Create Version PR or publish to npm
        uses: changesets/action@v1
        with:
          # Consumes queued changesets, bumps package.json, writes CHANGELOG.md
          version: bun run version
          # Runs `changeset publish` which calls `npm publish` (prepublishOnly re-builds + re-tests)
          publish: bun run release
          commit: 'release: version packages'
          title: 'release: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Sign published tarballs with cryptographic provenance from this commit.
          # Consumers can verify with `npm audit signatures`.
          NPM_CONFIG_PROVENANCE: 'true'
